crons:
  - name: rent-billing
    description: "Genera y cobra automáticamente la renta mensual de los contratos activos el día 1"
    cron: "0 8 1 * *"
    timezone: "America/Mexico_City"
    endpoint: "{{BASE_URL}}/api/cron/rent-billing"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
